# Render Blueprint for the API (backend/). Frontend deploys separately to Vercel - see README.
# https://render.com/docs/blueprint-spec
#
# rootDir is deliberately the repo root, not "backend": npm workspaces (-w)
# reliably resolves relative to the workspace root package.json, and running
# from a subdirectory with --prefix tricks is flaky across npm/Render
# versions ("No workspaces found: --workspace=backend"). `npm run <script> -w
# backend` from the root runs the script with cwd set to backend/, so
# relative paths like `node dist/server.js` still resolve correctly.
services:
  - type: web
    name: ai-interview-prep-kit-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w backend
    startCommand: npm start -w backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-flash-lite-latest
      - key: SEARCH_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
