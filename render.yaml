# Render Blueprint for the API (backend/). Frontend deploys separately to Vercel - see README.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ai-interview-prep-kit-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --prefix .. && npm run build --prefix .. -w backend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-flash-lite-latest
      - key: SEARCH_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
